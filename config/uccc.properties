# UCCC settings layered over the image's application.properties (config/application.properties,
# generated by `just config`). Loaded via SPRING_CONFIG_ADDITIONALLOCATION, so keys here win.

# Branding
skin.title=CU Anschutz Cancer Center cBioPortal
skin.email_contact=the UCCC Associate Director for Informatics and Data Science
skin.authorization_message=Access to this portal is only available to authorized CU Anschutz Cancer Center users.
skin.data_sets_footer=Public studies mirrored from the cbioportal.org public database (snapshot 2026-10-22).
skin.right_logo=uccc_logo.png
skin.footer= | <a href="https://medschool.cuanschutz.edu/colorado-cancer-center">CU Anschutz Cancer Center</a> | <a href="https://www.cbioportal.org/">cBioPortal.org</a>
skin.login.saml.registration_html=Sign in with CU Anschutz

# Home page: drop cbioportal.org's own news, newsletter, Twitter and testimonials (#5)
skin.blurb=This is the <b>CU Anschutz Cancer Center</b> instance of cBioPortal. It mirrors the public studies on <a href="https://www.cbioportal.org/">cbioportal.org</a>, and UCCC disease groups can add public cohorts to it. <p>To request a cohort, contact the UCCC Associate Director for Informatics and Data Science.</p> <p><b>Please cite</b> <a href="http://www.ncbi.nlm.nih.gov/pubmed/23550210">Gao et al. <i>Sci. Signal.</i> 2013</a> &amp; <a href="http://cancerdiscovery.aacrjournals.org/content/2/5/401.abstract">Cerami et al. <i>Cancer Discov.</i> 2012</a> when publishing results based on cBioPortal.</p>
skin.right_nav.show_whats_new=false
skin.right_nav.show_testimonials=false
# The News tab is cbioportal.org's release and data news; their new studies don't appear here until we reload.
skin.show_news_tab=false

# The frontend calls the API from these origins: the tailnet URL and the public hostname.
security.cors.allowed-origins=https://onclappc02.tail892754.ts.net:8443,https://uccc-cbioportal.cancerdatasci.org

# Per-query limits for the web app's ClickHouse queries (#3). They're set in the JDBC URL, so they
# don't apply to `just derive-tables`, which connects through clickhouse-client. The URL-encoded
# custom_settings form is what clickhouse-jdbc 0.6.2 passes through; max_execution_time is a driver
# option. Measured 2026-10-26: slowest query 16.7 s cold, peak 1.7 GiB, up to 66 threads.
# 90 s stays under Cloudflare's 100 s proxy timeout.
spring.datasource.url=jdbc:ch://cbioportal-database:8123/cbioportal?max_execution_time=90&custom_settings=max_memory_usage%3D17179869184%2Cmax_threads%3D16
